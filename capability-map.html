<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务商能力库 · 指标图谱</title>
<style>
:root {
  --bg: #0f1419;
  --bg-card: #1a1f2e;
  --bg-hover: #242b3d;
  --border: #2a3040;
  --text: #e4e8f1;
  --text2: #8892a8;
  --text3: #5a6478;
  --blue: #5b9cf5;
  --cyan: #3ec9d6;
  --green: #4ecb71;
  --orange: #f5a542;
  --purple: #9b7cf4;
  --red: #f56262;
  --pink: #f07bab;
  --teal: #3db8a0;
  --yellow: #e8c84a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Header */
.header {
  padding: 24px 32px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.header-left h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.header-left .sub {
  font-size: 12px;
  color: var(--text2);
  margin-top: 4px;
}
.header-stats {
  display: flex;
  gap: 24px;
  font-size: 13px;
  color: var(--text2);
}
.header-stats span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.header-stats strong {
  color: var(--text);
  font-size: 18px;
}
.badge-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  margin-left: 6px;
}
.badge-tag.system { background: rgba(94,159,245,0.15); color: var(--blue); }
.badge-tag.manual { background: rgba(245,165,66,0.15); color: var(--orange); }

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  padding: 8px 32px;
  font-size: 12px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
}

/* Main layout */
.main {
  display: flex;
  height: calc(100vh - 140px);
}

/* Left: Tree panel */
.tree-panel {
  width: 340px;
  min-width: 300px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 0;
}

.tree-domain {
  margin: 0;
}
.tree-domain > .tree-domain-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  transition: background .15s;
  border-left: 3px solid transparent;
}
.tree-domain > .tree-domain-head:hover {
  background: var(--bg-hover);
}
.tree-domain.active > .tree-domain-head {
  background: var(--bg-hover);
  border-left-color: var(--blue);
}
.tree-domain-head .icon {
  font-size: 16px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
}
.tree-domain-head .arrow {
  font-size: 10px;
  color: var(--text3);
  transition: transform .2s;
  width: 14px;
  flex-shrink: 0;
}
.tree-domain.expanded > .tree-domain-head .arrow {
  transform: rotate(90deg);
}
.tree-domain-head .count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text3);
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 400;
}
.tree-domain-body {
  display: none;
  padding: 0 0 4px 24px;
}
.tree-domain.expanded > .tree-domain-body {
  display: block;
}

.tree-sub {
  margin: 2px 0;
}
.tree-sub-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
  border-radius: 4px;
  transition: all .15s;
}
.tree-sub-head:hover {
  background: var(--bg-hover);
  color: var(--text);
}
.tree-sub.active > .tree-sub-head {
  background: rgba(94,159,245,0.08);
  color: var(--blue);
}
.tree-sub-head .sub-arrow {
  font-size: 9px;
  transition: transform .2s;
  width: 12px;
  flex-shrink: 0;
}
.tree-sub.expanded > .tree-sub-head .sub-arrow {
  transform: rotate(90deg);
}
.tree-sub-head .sub-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text3);
}
.tree-sub-items {
  display: none;
  padding: 0 0 2px 20px;
}
.tree-sub.expanded > .tree-sub-items {
  display: block;
}
.tree-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  border-radius: 3px;
  transition: all .15s;
}
.tree-item:hover {
  background: var(--bg-hover);
  color: var(--text);
}
.tree-item.active {
  color: var(--cyan);
  background: rgba(62,201,214,0.06);
}
.tree-item .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tree-item .dot.system { background: var(--blue); }
.tree-item .dot.manual { background: var(--orange); }

/* Right: Detail panel */
.detail-panel {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
  display: flex;
  flex-direction: column;
}

.detail-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 14px;
  flex-direction: column;
  gap: 8px;
}
.detail-empty .big-icon {
  font-size: 48px;
  opacity: .3;
}

/* Detail content */
.detail-header {
  margin-bottom: 28px;
}
.detail-header .breadcrumb {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 8px;
}
.detail-header .breadcrumb span {
  color: var(--text2);
}
.detail-header h2 {
  font-size: 24px;
  font-weight: 700;
}
.detail-header .meta {
  font-size: 13px;
  color: var(--text2);
  margin-top: 6px;
  display: flex;
  gap: 16px;
  align-items: center;
}

/* Overview stats (domain level) */
.domain-overview {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.overview-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 20px;
  transition: all .2s;
}
.overview-card:hover {
  border-color: var(--blue);
  background: var(--bg-hover);
}
.overview-card .card-label {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 6px;
}
.overview-card .card-value {
  font-size: 28px;
  font-weight: 700;
}
.overview-card .card-sub {
  font-size: 12px;
  color: var(--text2);
  margin-top: 4px;
}

/* Indicators table (sub level) */
.indicators-table {
  width: 100%;
  border-collapse: collapse;
}
.indicators-table thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .5px;
  border-bottom: 1px solid var(--border);
}
.indicators-table tbody td {
  padding: 12px 14px;
  font-size: 13px;
  border-bottom: 1px solid rgba(42,48,64,0.4);
  vertical-align: top;
}
.indicators-table tbody tr:hover td {
  background: rgba(255,255,255,0.02);
}
.indicators-table .idx {
  color: var(--text3);
  width: 30px;
  font-size: 12px;
}
.indicators-table .name {
  font-weight: 600;
  color: var(--text);
  min-width: 160px;
}
.indicators-table .def {
  color: var(--text2);
  font-size: 12px;
  line-height: 1.6;
  max-width: 480px;
}
.indicators-table .tag-cell {
  text-align: center;
}
.indicators-table .source-cell {
  text-align: center;
}

.tag-pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.tag-pill.通用 { background: rgba(78,203,113,0.12); color: var(--green); }
.tag-pill.品牌 { background: rgba(155,124,244,0.12); color: var(--purple); }
.tag-pill.电商 { background: rgba(62,201,214,0.12); color: var(--cyan); }

.source-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 10px;
}
.source-pill.系统 { background: rgba(94,159,245,0.1); color: var(--blue); }
.source-pill.人工 { background: rgba(245,165,66,0.1); color: var(--orange); }
.source-pill::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
}
.source-pill.系统::before { background: var(--blue); }
.source-pill.人工::before { background: var(--orange); }

/* Full-domain map */
.map-section {
  margin-top: 24px;
}
.map-section h3 {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 16px;
  font-weight: 600;
}
.domain-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.domain-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
  cursor: pointer;
  transition: all .2s;
}
.domain-card:hover {
  border-color: var(--blue);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.domain-card .dc-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.domain-card .dc-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
}
.domain-card .dc-name {
  font-size: 16px;
  font-weight: 700;
}
.domain-card .dc-subs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.domain-card .dc-sub-tag {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(255,255,255,0.04);
  color: var(--text2);
  border: 1px solid var(--border);
}
.domain-card .dc-footer {
  margin-top: 14px;
  font-size: 11px;
  color: var(--text3);
  display: flex;
  justify-content: space-between;
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 900px) {
  .main { flex-direction: column; }
  .tree-panel { width: 100%; min-width: unset; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .domain-grid { grid-template-columns: 1fr; }
  .domain-overview { grid-template-columns: 1fr 1fr; }
}

.domain-colors {
  --c0: #5b9cf5;
  --c1: #9b7cf4;
  --c2: #4ecb71;
  --c3: #f5a542;
  --c4: #f07bab;
  --c5: #3ec9d6;
  --c6: #e8c84a;
  --c7: #f56262;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>服务商能力库 · 指标全景图谱</h1>
    <div class="sub">基于能力域 → 子板块 → 指标三层结构，层层下钻查看详情</div>
  </div>
  <div class="header-stats" id="headerStats"></div>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span> 系统获取</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--orange)"></span> 人工采集</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span> 通用指标</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--cyan)"></span> 电商指标</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--purple)"></span> 品牌指标</div>
</div>

<div class="main">
  <!-- Left tree -->
  <div class="tree-panel" id="treePanel"></div>

  <!-- Right detail -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty">
      <div class="big-icon">⬡</div>
      <div>选择左侧能力域或子板块查看详情</div>
    </div>
  </div>
</div>

 "tag": "电商", "source": "人工"}, {"name": "场景化直播设施", "def": "服务商是否拥有场景化直播设施（仓库/原产地/展会展位等）", "tag": "电商", "source": "人工"}, {"name": "大场GMV/消耗", "def": "服务商单场大型直播活动的GMV和消耗效果数据", "tag": "电商", "source": "系统"}]}, {"name": "KOC/团长分销", "items": [{"name": "KOC/团长网络", "def": "服务商是否拥有KOC或团长分销网络", "tag": "电商", "source": "人工"}, {"name": "KOC可调动量级", "def": "服务商可调动的KOC数量规模", "tag": "电商", "source": "人工"}, {"name": "KOC行业/品类覆盖", "def": "服务商KOC资源覆盖的商品品类", "tag": "电商", "source": "人工"}, {"name": "分销案例", "def": "服务商通过KOC/团长分销的成功案例：客户×品×GMV。案例需包含：分销GMV及订单量、代播与分销协同情况、公域引流到私域成交路径", "tag": "电商", "source": "人工"}, {"name": "分销模式", "def": "服务商采用的分销模式（短视频/社群/直播等）", "tag": "电商", "source": "人工"}, {"name": "KOC机构属性", "def": "服务商是否以KOC分销为主业的机构", "tag": "电商", "source": "人工"}]}]}, {"name": "供应链与货品能力", "subs": [{"name": "供应链/货品能力", "items": [{"name": "品牌授权", "def": "服务商拥有的品牌授权名单及授权类型", "tag": "电商", "source": "人工"}, {"name": "经销资源", "def": "服务商合作的经销商网络及货盘品类", "tag": "电商", "source": "人工"}, {"name": "供应链关系(工厂/供应商)", "def": "服务商是否与工厂或供应商建立了合作关系", "tag": "电商", "source": "人工"}, {"name": "小单元(贴牌分销)参与", "def": "服务商参与过平台贴牌分销小单元项目的记录", "tag": "电商", "source": "系统"}, {"name": "供应链资源描述", "def": "服务商拥有的供应链资源具体描述（工厂/白牌/货源）", "tag": "电商", "source": "人工"}, {"name": "产业带货品供给", "def": "服务商在产业带能提供的具体货品品类及地域", "tag": "电商", "source": "人工"}, {"name": "自有品牌/白牌", "def": "服务商是否拥有自有品牌或白牌货品", "tag": "电商", "source": "人工"}, {"name": "货盘品类", "def": "服务商能提供的货品品类范围", "tag": "电商", "source": "人工"}]}]}];

const COLORS = ['#5b9cf5','#9b7cf4','#4ecb71','#f5a542','#f07bab','#3ec9d6','#e8c84a','#f56262'];
const ICONS = ['📊','🎯','📈','🔍','🛠️','🎪','📦','🔗'];

function init() {
  const stats = computeStats();
  document.getElementById('headerStats').innerHTML = `
    <span>能力域 <strong>${stats.domains}</strong></span>
    <span>子板块 <strong>${stats.subs}</strong></span>
    <span>指标 <strong>${stats.items}</strong></span>
    <span><span class="badge-tag system">系统</span> ${stats.system}</span>
    <span><span class="badge-tag manual">人工</span> ${stats.manual}</span>
  `;

  renderTree();
  renderFullMap();
}

function computeStats() {
  let subs = 0, items = 0, system = 0, manual = 0;
  DATA.forEach(d => {
    subs += d.subs.length;
    d.subs.forEach(s => {
      items += s.items.length;
      s.items.forEach(i => {
        if (i.source === '系统') system++;
        else manual++;
      });
    });
  });
  return { domains: DATA.length, subs, items, system, manual };
}

function renderTree() {
  const panel = document.getElementById('treePanel');
  panel.innerHTML = DATA.map((d, di) => {
    const color = COLORS[di % COLORS.length];
    const icon = ICONS[di % ICONS.length];
    const itemCount = d.subs.reduce((sum, s) => sum + s.items.length, 0);
    return `
    <div class="tree-domain expanded" data-di="${di}">
      <div class="tree-domain-head" onclick="toggleDomain(this)" style="--c:${color}">
        <span class="arrow">▶</span>
        <span class="icon">${icon}</span>
        <span>${d.name}</span>
        <span class="count">${itemCount}</span>
      </div>
      <div class="tree-domain-body">
        ${d.subs.map((s, si) => `
        <div class="tree-sub" data-di="${di}" data-si="${si}">
          <div class="tree-sub-head" onclick="clickSub(event, ${di}, ${si})">
            <span class="sub-arrow">▶</span>
            <span>${s.name}</span>
            <span class="sub-count">${s.items.length}</span>
          </div>
          <div class="tree-sub-items">
            ${s.items.map((item, ii) => `
            <div class="tree-item" data-di="${di}" data-si="${si}" data-ii="${ii}" onclick="clickItem(event, ${di}, ${si}, ${ii})">
              <span class="dot ${item.source==='系统'?'system':'manual'}"></span>
              <span>${item.name}</span>
            </div>`).join('')}
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleDomain(head) {
  const domain = head.parentElement;
  domain.classList.toggle('expanded');
}

function clickSub(e, di, si) {
  e.stopPropagation();
  const sub = e.target.closest('.tree-sub');
  sub.classList.toggle('expanded');
  // Highlight and show detail
  document.querySelectorAll('.tree-sub').forEach(s => s.classList.remove('active'));
  sub.classList.add('active');
  document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'));
  showSubDetail(di, si);
}

function clickItem(e, di, si, ii) {
  e.stopPropagation();
  document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.tree-sub').forEach(s => s.classList.remove('active'));
  const item = e.target.closest('.tree-item');
  item.classList.add('active');
  const sub = item.closest('.tree-sub');
  sub.classList.add('expanded', 'active');
  showItemDetail(di, si, ii);
}

function showDomainDetail(di) {
  const d = DATA[di];
  const color = COLORS[di % COLORS.length];
  const panel = document.getElementById('detailPanel');
  const allItems = [];
  d.subs.forEach(s => s.items.forEach(i => allItems.push({sub: s.name, ...i})));

  panel.innerHTML = `
    <div class="detail-header">
      <div class="breadcrumb">能力域</div>
      <h2>${d.name}</h2>
      <div class="meta">
        <span>${d.subs.length} 个子板块</span>
        <span>·</span>
        <span>${allItems.length} 个指标</span>
      </div>
    </div>
    <div class="domain-overview">
      ${d.subs.map(s => `
      <div class="overview-card" onclick="clickSubByData('${d.name}','${s.name}')" style="cursor:pointer">
        <div class="card-label">${s.name}</div>
        <div class="card-value">${s.items.length}</div>
        <div class="card-sub">个指标</div>
      </div>`).join('')}
    </div>
    <div class="map-section">
      <h3>全部指标一览</h3>
      ${buildTable(allItems)}
    </div>
  `;
}

function showSubDetail(di, si) {
  const d = DATA[di];
  const s = d.subs[si];
  const color = COLORS[di % COLORS.length];
  const panel = document.getElementById('detailPanel');

  panel.innerHTML = `
    <div class="detail-header">
      <div class="breadcrumb"><span>${d.name}</span> / 子板块</div>
      <h2>${s.name}</h2>
      <div class="meta">
        <span>${s.items.length} 个指标</span>
      </div>
    </div>
    ${buildTable(s.items)}
  `;
}

function showItemDetail(di, si, ii) {
  const item = DATA[di].subs[si].items[ii];
  const d = DATA[di];
  const s = d.subs[si];
  const panel = document.getElementById('detailPanel');

  panel.innerHTML = `
    <div class="detail-header">
      <div class="breadcrumb"><span>${d.name}</span> / <span>${s.name}</span> / 指标</div>
      <h2>${item.name}</h2>
      <div class="meta">
        <span class="tag-pill ${item.tag}">${item.tag}</span>
        <span>·</span>
        <span class="source-pill ${item.source}">${item.source}获取</span>
      </div>
    </div>
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:24px;">
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">指标定义</div>
      <div style="font-size:15px;line-height:1.8;color:var(--text);white-space:pre-wrap;">${item.def}</div>
    </div>
    <div style="margin-top:20px;">
      <button onclick="showSubDetail(${di},${si})" style="background:var(--bg-card);border:1px solid var(--border);color:var(--text2);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;">← 返回子板块全部指标</button>
    </div>
  `;
}

function clickSubByData(domainName, subName) {
  const di = DATA.findIndex(d => d.name === domainName);
  const si = DATA[di].subs.findIndex(s => s.name === subName);
  if (di >= 0 && si >= 0) {
    showSubDetail(di, si);
    // Sync tree
    document.querySelectorAll('.tree-sub').forEach(el => el.classList.remove('active'));
    const subEl = document.querySelector(`.tree-sub[data-di="${di}"][data-si="${si}"]`);
    if (subEl) {
      subEl.classList.add('expanded', 'active');
      const domainEl = subEl.closest('.tree-domain');
      if (domainEl) domainEl.classList.add('expanded');
      subEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function buildTable(items) {
  return `
  <table class="indicators-table">
    <thead>
      <tr>
        <th>#</th>
        <th>指标名称</th>
        <th>指标定义</th>
        <th>标签</th>
        <th>获取途径</th>
      </tr>
    </thead>
    <tbody>
      ${items.map((item, idx) => `
      <tr>
        <td class="idx">${idx + 1}</td>
        <td class="name">${item.name}</td>
        <td class="def">${item.def}</td>
        <td class="tag-cell"><span class="tag-pill ${item.tag}">${item.tag}</span></td>
        <td class="source-cell"><span class="source-pill ${item.source}">${item.source}</span></td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderFullMap() {
  // Add domain click handlers for the full map view when first entering
  document.querySelectorAll('.tree-domain-head').forEach((head, di) => {
    head.addEventListener('dblclick', () => showDomainDetail(di));
    // Single click with Ctrl to show detail
    head.addEventListener('click', function(e) {
      if (e.ctrlKey || e.metaKey) {
        showDomainDetail(di);
      }
    });
  });
}

init();
</script>
</body>
</html>
